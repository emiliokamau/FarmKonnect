<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · FarmKonnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Create your FarmKonnect account</h2>
      <form id="registerForm" class="form">
        <label>Name<input name="name" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Phone Number<input name="phone" required placeholder="+2547..."></label>
        <label>Password<input type="password" name="password" minlength="6" required></label>
        <label>Confirm Password<input type="password" name="confirm_password" minlength="6" required></label>
        <button class="btn-primary">Register</button>
        <p id="formMsg" class="form-msg"></p>
      </form>
      <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
