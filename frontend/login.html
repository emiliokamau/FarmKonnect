<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · FarmKonnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Login to FarmKonnect</h2>

      <form id="loginForm" class="form" autocomplete="on" novalidate>
        <label>
          Phone Number
          <input type="tel" name="phone" required placeholder="+254712345678" autocomplete="tel">
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn-primary" type="submit">Send OTP</button>
        <p id="formMsg" class="form-msg"></p>
      </form>

      <p class="auth-alt">No account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
