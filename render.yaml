services:
  - type: web
    name: farmkonnect
    runtime: python
    # No rootDir: this service runs from the repository root, and the root
    # wrappers (manage.py, asgi.py, wsgi.py, create_admin.py) each chdir into
    # backend/ before importing farmkonnect.
    #
    # If you ever set Render's Root Directory to "backend" instead, then switch
    # the commands below to the plain forms and drop the wrappers:
    #   buildCommand: pip install -r requirements.txt && python manage.py pre_migrate && python manage.py migrate && python create_admin.py && python manage.py collectstatic --noinput
    #   startCommand: daphne -b 0.0.0.0 -p $PORT farmkonnect.asgi:application
    #
    # Do NOT mix the two: "farmkonnect.asgi:application" only resolves from
    # backend/, and fails from the root with "No module named farmkonnect".
    #
    # NOTE: set DATABASE_URL on this service. Without it the app falls back to
    # SQLite on an ephemeral filesystem, so data is lost on every deploy.
    buildCommand: pip install -r requirements.txt && python manage.py pre_migrate && python manage.py migrate && python create_admin.py && python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SUPERUSER_USERNAME
        sync: false
      - key: SUPERUSER_EMAIL
        sync: false
      - key: SUPERUSER_PHONE
        sync: false
      - key: SUPERUSER_PASSWORD
        sync: false
      - key: SUPERUSER_FIRST_NAME
        value: FarmKonnect
      - key: SUPERUSER_LAST_NAME
        value: Admin
